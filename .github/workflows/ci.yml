name: CI
# Runs on every push to dev.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Typecheck and unit tests
    # Fork PRs stay on GitHub-hosted runners. Same-repo PRs use self-hosted — hosted jobs currently fail at spawn (~4s, no steps).
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "digitalab-prod"]') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: jobagent
          POSTGRES_DB: jobagent
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent -d jobagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and test
        env:
          APPLY_API_TOKEN: ci-unit-test-token
          TECHNICAL_CV_PATH: /tmp/ci-technical-cv.pdf
          MARKETING_CV_PATH: /tmp/ci-marketing-cv.pdf
          LLM_API_KEY: ci-unit-test-key
          MCP_IDEMPOTENCY_TEST_DATABASE_URL: postgres://jobagent:jobagent@127.0.0.1:55432/jobagent
        run: |
          set -euo pipefail
          npm install
          npm run build
          npm test

      - name: MCP gateway build and test
        env:
          JOBAGENT_MCP_ACCESS_TOKEN: ci-mcp-token
          JOBAGENT_MCP_DATABASE_URL: postgres://jobagent:jobagent@127.0.0.1:55432/jobagent
          JOBAGENT_API_TOKEN: ci-unit-test-token
          JOBAGENT_API_BASE_URL: http://127.0.0.1:3099
        run: |
          set -euo pipefail
          cd mcp-gateway
          npm install
          npm run build
          npm test

      - name: Validate job n8n workflow exports
        run: |
          set -euo pipefail
          bash orchestration/n8n/scripts/validate-workflow-exports.sh
          bash orchestration/n8n/scripts/check-pick-jobs-constants.sh

      - name: Pipeline repair Python tests
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/apply_pipeline/tests -p 'test_*.py' -v
