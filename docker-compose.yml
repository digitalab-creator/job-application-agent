services:
  workspace-db:
    image: postgres:16-alpine
    container_name: job-application-agent-db
    restart: unless-stopped
    profiles:
      - native
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - workspace_pg_data:/var/lib/postgresql/data
    networks:
      - n8n_net

  jobagent-mcp-gateway:
    build: ./mcp-gateway
    container_name: jobagent-mcp-gateway
    restart: unless-stopped
    profiles:
      - mcp
    ports:
      - "127.0.0.1:3101:3101"
    environment:
      MCP_GATEWAY_PORT: "3101"
      MCP_GATEWAY_BIND_HOST: "0.0.0.0"
      JOBAGENT_MCP_ACCESS_TOKEN: ${JOBAGENT_MCP_ACCESS_TOKEN:-disabled-mcp-not-in-profile}
      JOBAGENT_DEFAULT_WORKSPACE_ID: ${JOBAGENT_DEFAULT_WORKSPACE_ID:-internal}
      JOBAGENT_API_BASE_URL: http://job-application-agent:3000
      JOBAGENT_API_TOKEN: ${APPLY_API_TOKEN}
      JOBAGENT_MCP_DATABASE_URL: ${JOBAGENT_MCP_DATABASE_URL:-postgres://jobagent_mcp_readonly:${JOBAGENT_MCP_READONLY_PASSWORD:-disabled}@workspace-db:5432/jobagent}
      JOBAGENT_GITHUB_REPO: ${JOBAGENT_GITHUB_REPO:-digitalab-creator/job-application-agent}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MCP_GATEWAY_AUDIT_LOG: /app/data/ledger/mcp-gateway-audit.jsonl
    volumes:
      - ./data/ledger:/app/data/ledger
    depends_on:
      - job-application-agent
      - workspace-db
    networks:
      - n8n_net

  job-application-agent:
    build:
      context: .
      args:
        IMAGE_BUILD_GIT_SHA: ${IMAGE_BUILD_GIT_SHA:-}
    container_name: job-application-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:3099:3000"
    env_file:
      - .env
    environment:
      JOBAGENT_MCP_ALLOWED_WORKSPACE_ID: ${JOBAGENT_MCP_ALLOWED_WORKSPACE_ID:-internal}
    shm_size: "1gb"
    mem_limit: 3g
    volumes:
      - ./data/cv:/app/data/cv:ro
      - ./data/ledger:/app/data/ledger
      - ./tmp/deploy:/app/tmp/deploy:ro
      - ./data/config:/app/data/config
      - ./generated-cv:/app/generated-cv
      - ./screenshots:/app/screenshots
      - ./audit:/app/audit
      - ./data/browser-profile:/app/data/browser-profile
    networks:
      - n8n_net

networks:
  n8n_net:
    external: true
    name: n8n_n8n_net

volumes:
  workspace_pg_data:
